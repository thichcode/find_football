user nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    upstream find_football {
        server 127.0.0.1:3000;
    }

    upstream tizenbrew_kit {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;

        # Health check endpoint for find_football
        location = /health {
            proxy_pass http://find_football/health;
        }

        # All /api/* and /telegram/* endpoints -> find_football
        location ~ ^/api/ {
            proxy_pass http://find_football;
        }

        # All other endpoints -> tizenbrew_kit
        location / {
            proxy_pass http://tizenbrew_kit;
        }
    }
}