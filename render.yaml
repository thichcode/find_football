services:
  - type: web
    name: find-football-tizenbrew
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # find_football
      - key: HOST
        value: 0.0.0.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      # tizenbrew-kit (yt-dlp-resolver đọc từ env, không hardcode)
      - key: API_KEY
        sync: false
      # AI (OpenRouter, model free mặc định, có thể đổi qua env AI_MODEL)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-3.5-turbo