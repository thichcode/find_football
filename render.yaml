services:
  - type: web
    name: find-football-tizenbrew
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # find_football
      - key: HOST
        value: 0.0.0.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      # tizenbrew-kit
      - key: API_KEY
        sync: false
      # Optional: if tizenbrew-kit requires additional env vars
      - key: YT_DLP_PATH
        sync: false